name: verify-nightly

# Re-runs the canary's proof claim independently: fetches a fresh nonce-bound
# SEV-SNP proof bundle from the live origin and appraises it against
# trust-policy.json (obtained from this repo, not from the VM).
# Red until the proof-serving proxy is rolled out to the canary's env — see
# README "Independent verification".

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately to the cap rev the trust-policy anchors were validated
      # against (post-7f354bcb platform-release root). Bump together with any repin.
      - name: Install enclava CLI (pinned rev)
        run: cargo install --git https://github.com/enclava-labs/cap --rev 9d86d59f22b44e702c5e8997cf7c73e22f475d9e enclava-cli --locked

      - name: Verify live canary (proof bundle + policy appraisal)
        run: enclava verify https://canary-r14.5c7c00c7.dev.enclava.work --policy trust-policy.json
